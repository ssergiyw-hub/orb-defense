<!doctype html><html><head><style>body{margin:0;background:#2a2420}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), W = 1200, H = 420;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2420);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 3); scene.add(d);

r.setScissorTest(true);
for (let i = 0; i < 4; i++) {

  const s2 = new THREE.Scene(); s2.background = scene.background; s2.add(holder); scene.children.filter(x => x.isLight).forEach(l => s2.add(l.clone()));

}

</script></body></html>
