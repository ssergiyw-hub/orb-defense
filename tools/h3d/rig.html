<script type="module">

toonify(root);
// weapon in the right hand
const wq = q.get('w');

const d = new THREE.DirectionalLight(0xffffff, mode === 'toon' ? 1.8 : 1.4); d.position.set(-1.5, 3, 2.5); scene.add(d);

const S = +(q.get('size') || 256);

r.setClearColor(0x000000, 0);
